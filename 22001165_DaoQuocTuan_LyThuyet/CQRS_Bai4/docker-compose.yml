version: '3.8'

services:
  command-service:
    build:
      context: ./command-service
      dockerfile: Dockerfile
    container_name: ticket-command-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
    volumes:
      - ./command-service/src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ticket-network

  query-service:
    build:
      context: ./query-service
      dockerfile: Dockerfile
    container_name: ticket-query-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
    volumes:
      - ./query-service/src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - command-service
    networks:
      - ticket-network

networks:
  ticket-network:
    driver: bridge

# Usage:
# docker-compose up -d                # Start both services
# docker-compose logs -f               # View logs
# docker-compose down                  # Stop both services
